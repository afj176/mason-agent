# Builds, tests and packages Mason Agent for macOS on a real Mac. The Swift code is developed on Windows,
# so this is where the SwiftUI app is compiled and the macOS sandbox is exercised.
name: macOS

on:
  push:
    branches: [main, cross-platform]
    paths: ['macos/**', '.github/workflows/macos.yml']
  pull_request:
    paths: ['macos/**', '.github/workflows/macos.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Swift version
        run: swift --version
      - name: Test
        working-directory: macos
        # A test that hangs would otherwise run until the job's limit with nothing in the log. After six minutes the
        # stuck test's stacks are printed and the run is stopped, which fails the step.
        run: |
          swift test &
          tests=$!
          ( sleep 360; echo "::error::The tests ran for six minutes. Sampling them, then stopping them."; sample xctest 2 2>/dev/null | grep -v "^ *$" | head -220; pkill -9 xctest ) &
          watchdog=$!
          wait $tests; status=$?
          kill $watchdog 2>/dev/null || true
          exit $status
      - name: Build the app, zip and installer
        working-directory: macos
        run: Scripts/build-app.sh
      - name: The app starts and stays up
        working-directory: macos
        run: |
          "dist/Mason Agent.app/Contents/MacOS/MasonAgent" &
          pid=$!
          sleep 8
          kill -0 $pid
          kill $pid
      - name: The command line tool runs a session
        working-directory: macos
        run: |
          mkdir -p "$RUNNER_TEMP/project" && cd "$RUNNER_TEMP/project"
          printf '/status\n/permission auto\n/models\n/exit\n' | MASON_DATA_HOME="$RUNNER_TEMP/home" "$GITHUB_WORKSPACE/macos/dist/Mason Agent.app/Contents/Resources/bin/mason" | tee "$RUNNER_TEMP/session.txt"
          grep -q "sandbox available for Auto" "$RUNNER_TEMP/session.txt"
      - name: Install the package, then check the command line and the app
        working-directory: macos
        run: |
          sudo installer -pkg dist/MasonAgent-*-macos.pkg -target /
          SHOTS="$RUNNER_TEMP/screenshots" Scripts/check-installed.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: MasonAgent-macos-screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        with:
          name: MasonAgent-macos
          path: |
            macos/dist/*.zip
            macos/dist/*.pkg
            macos/dist/SHA256SUMS.txt
          if-no-files-found: error
