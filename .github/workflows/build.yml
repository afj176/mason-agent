# Compiles the app on every push and pull request, so a broken build shows up before a release.
name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['site/**', 'docs/**', '**.md']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build
        shell: pwsh
        run: dotnet build src/MasonAgent/MasonAgent.csproj -c Release -p:Platform=x64 -nologo
      - name: Verify coding harness recovery
        shell: pwsh
        run: dotnet run --project tests/Mason.CodeChecks -c Release -- --harness-recovery-checks "$env:RUNNER_TEMP"
