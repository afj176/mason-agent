# Publishes the macOS and Linux apps as a preview: a GitHub prerelease tagged "preview" that is replaced on each run.
# The website's macOS and Linux buttons point at its stable file names until a full release carries those files.
# It is a prerelease, so "latest release" (the Windows downloads) is not affected. Run it by hand from the Actions tab.
name: Preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      value: ${{ steps.read.outputs.value }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: echo "value=$(sed -n "s/^  version: '\(.*\)',$/\1/p" linux/meson.build | head -1)" >> "$GITHUB_OUTPUT"

  packages:
    needs: version
    uses: ./.github/workflows/packages.yml
    with:
      version: ${{ needs.version.outputs.value }}

  publish:
    needs: [version, packages]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          merge-multiple: true
          path: release
      - name: Replace the preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.value }}
        run: |
          ( cd release && sha256sum * > SHA256SUMS.txt && ls -la )
          cat > notes.md <<EOF
          Preview builds of Mason Agent $VERSION for macOS and Linux, built from ${GITHUB_SHA:0:7}. This release is replaced whenever a newer preview is built.

          - **macOS 14 or later** (Apple silicon and Intel): \`MasonAgent-macos.pkg\` installs the app and the \`mason\` command; \`MasonAgent-macos.zip\` is the app alone. The build is not notarized, so macOS asks you to allow it the first time.
          - **Linux x64**: \`mason-agent-linux-amd64.deb\` for Debian and Ubuntu 24.04 or later; \`mason-agent-linux-amd64.tar.gz\` for other distributions (run its \`install.sh\`).

          These cover the core of Mason Agent. Some Windows features are not in them yet; see the README. The Windows download is the latest full release.
          EOF
          sed -i 's/^          //' notes.md
          gh release delete preview --cleanup-tag --yes 2>/dev/null || true
          gh release create preview release/* --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Mason Agent $VERSION for macOS and Linux (preview)" --notes-file notes.md
