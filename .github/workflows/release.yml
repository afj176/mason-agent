# Builds the Windows installer and portable ZIP, and the macOS and Linux packages, and attaches them to a GitHub Release.
# Nothing is published unless the Windows build passes its model qualification, so a release always carries all three.
# Push a tag such as v1.2.3, or run it by hand from the Actions tab with a version number.
# Each release carries versioned files plus stable-named copies, so the website's download buttons
# can always point at releases/latest/download/<name>.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (for example 1.2.3)
        required: true

permissions:
  contents: write

env:
  APP: MasonAgent
  ISS: windows/packaging/MasonAgent.iss

jobs:
  qualify:
    runs-on: [self-hosted, Windows, mason-model-evals]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Qualify the release against both local models
        shell: pwsh
        env:
          MASON_EVAL_ENDPOINT: ${{ vars.MASON_EVAL_ENDPOINT }}
          MASON_EVAL_MODEL: ${{ vars.MASON_EVAL_MODEL }}
          MASON_SECONDARY_EVAL_ENDPOINT: ${{ vars.MASON_SECONDARY_EVAL_ENDPOINT }}
          MASON_SECONDARY_EVAL_MODEL: ${{ vars.MASON_SECONDARY_EVAL_MODEL }}
        run: |
          $area="$env:RUNNER_TEMP/mason-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          ./windows/scripts/Invoke-ModelBenchmark.ps1 -Endpoint $env:MASON_EVAL_ENDPOINT -Model $env:MASON_EVAL_MODEL -OutputDirectory $area
          ./windows/scripts/Invoke-WorkflowQualification.ps1 -Endpoint $env:MASON_EVAL_ENDPOINT -Model $env:MASON_EVAL_MODEL -SecondaryEndpoint $env:MASON_SECONDARY_EVAL_ENDPOINT -SecondaryModel $env:MASON_SECONDARY_EVAL_MODEL -OutputDirectory "$area/workflow"
      - uses: actions/upload-artifact@v7
        with:
          name: model-evidence
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/mason-${{ github.run_id }}-${{ github.run_attempt }}/report.json
            ${{ runner.temp }}/mason-${{ github.run_id }}-${{ github.run_attempt }}/workflow/workflow-evidence.json
  packages:
    uses: ./.github/workflows/packages.yml
    with:
      version: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}

  build:
    needs: [qualify, packages]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: model-evidence
          path: ${{ runner.temp }}/model-evidence

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ github.event.inputs.version }}' } else { '${{ github.ref_name }}'.TrimStart('v') }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Version must look like 1.2.3, got '$v'" }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Inno Setup
        id: inno
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Host }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup was not found after install' }
          "path=$iscc" >> $env:GITHUB_OUTPUT

      - name: Publish installer and portable ZIP
        shell: pwsh
        run: ./windows/scripts/Publish.ps1 -Version ${{ steps.version.outputs.value }} -ModelEvidence "$env:RUNNER_TEMP/model-evidence/report.json" -WorkflowEvidence "$env:RUNNER_TEMP/model-evidence/workflow/workflow-evidence.json" -Installer -InnoCompiler '${{ steps.inno.outputs.path }}'

      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          merge-multiple: true
          path: ${{ runner.temp }}/packages

      - name: Stage release files
        id: stage
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.value }}'
          $out = New-Item -ItemType Directory -Force release
          $setup = "windows/artifacts/$env:APP-$v-Setup-x64.exe"; $zip = "windows/artifacts/$env:APP-$v-win-x64.zip"
          Copy-Item $setup, $zip $out
          # Stable names for the website's "latest" download links.
          Copy-Item $setup "$out/$env:APP-Setup-x64.exe"; Copy-Item $zip "$out/$env:APP-win-x64.zip"
          # The macOS and Linux packages, already staged with versioned and stable names.
          Copy-Item "$env:RUNNER_TEMP/packages/*" $out
          Get-ChildItem $out -File | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $($_.Name)" } | Set-Content "$out/SHA256SUMS.txt" -Encoding ascii
          Get-ChildItem $out | Format-Table Name, Length | Out-Host

      - name: Create or update the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v${{ steps.version.outputs.value }}'
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --title "$env:APP ${{ steps.version.outputs.value }}" --generate-notes --target $env:GITHUB_SHA }
          gh release upload $tag (Get-ChildItem release -File).FullName --clobber
