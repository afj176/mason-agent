# Builds the Windows installer and portable ZIP, and the macOS and Linux packages, and attaches them to a GitHub Release.
# A merged pull request runs this through release-on-merge.yml after it bumps the version and pushes the tag.
# It can also run from a pushed tag such as v1.2.3, or by hand from the Actions tab with a version number.
# Each release carries versioned files plus stable-named copies, so the website's download buttons
# can always point at releases/latest/download/<name>.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (for example 1.2.3)
        required: true
  workflow_call:
    inputs:
      version:
        description: Version to build, such as 1.2.3
        required: true
        type: string
      ref:
        description: The tag to build, such as v1.2.3
        required: true
        type: string

permissions:
  contents: write

env:
  APP: MasonAgent
  ISS: windows/packaging/MasonAgent.iss

jobs:
  packages:
    uses: ./.github/workflows/packages.yml
    with:
      version: ${{ inputs.version || github.ref_name }}
      ref: ${{ inputs.ref }}

  build:
    needs: [packages]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = '${{ inputs.version }}'
          if (-not $v) { $v = '${{ github.ref_name }}'.TrimStart('v') }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Version must look like 1.2.3, got '$v'" }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Inno Setup
        id: inno
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Host }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup was not found after install' }
          "path=$iscc" >> $env:GITHUB_OUTPUT

      - name: Publish installer and portable ZIP
        shell: pwsh
        run: ./windows/scripts/Publish.ps1 -Version ${{ steps.version.outputs.value }} -Installer -InnoCompiler '${{ steps.inno.outputs.path }}'

      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          merge-multiple: true
          path: ${{ runner.temp }}/packages

      - name: Stage release files
        id: stage
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.value }}'
          $out = New-Item -ItemType Directory -Force release
          $setup = "windows/artifacts/$env:APP-$v-Setup-x64.exe"; $zip = "windows/artifacts/$env:APP-$v-win-x64.zip"
          Copy-Item $setup, $zip $out
          # Stable names for the website's "latest" download links.
          Copy-Item $setup "$out/$env:APP-Setup-x64.exe"; Copy-Item $zip "$out/$env:APP-win-x64.zip"
          # The macOS and Linux packages, already staged with versioned and stable names.
          Copy-Item "$env:RUNNER_TEMP/packages/*" $out
          Get-ChildItem $out -File | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $($_.Name)" } | Set-Content "$out/SHA256SUMS.txt" -Encoding ascii
          Get-ChildItem $out | Format-Table Name, Length | Out-Host

      - name: Create or update the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v${{ steps.version.outputs.value }}'
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --title "$env:APP ${{ steps.version.outputs.value }}" --generate-notes --target $env:GITHUB_SHA }
          gh release upload $tag (Get-ChildItem release -File).FullName --clobber
