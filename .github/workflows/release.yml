# Builds the Windows installer and portable ZIP, and the macOS and Linux packages, and attaches them to a GitHub Release.
# A merged pull request runs this through release-on-merge.yml after it bumps the version and pushes the tag.
# It can also run from a pushed tag such as v1.2.3, or by hand from the Actions tab with a version number.
# Each release carries versioned files plus stable-named copies, so the website's download buttons
# can always point at releases/latest/download/<name>.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (for example 1.2.3)
        required: true
  workflow_call:
    inputs:
      version:
        description: Version to build, such as 1.2.3
        required: true
        type: string
      ref:
        description: The tag to build, such as v1.2.3
        required: true
        type: string

permissions:
  contents: write

env:
  APP: MasonAgent
  ISS: windows/packaging/MasonAgent.iss

jobs:
  packages:
    uses: ./.github/workflows/packages.yml
    with:
      version: ${{ inputs.version || github.ref_name }}
      ref: ${{ inputs.ref }}

  build:
    needs: [packages]
    runs-on: windows-latest
    steps:
      # The coding checks start sandboxed programs from deep test folders; Mason shortens those paths with 8.3 names,
      # which the runner's work drive does not create. Turn them on before the checkout makes any folders.
      - name: Short names on the work drive
        shell: pwsh
        run: |
          $drive = $env:GITHUB_WORKSPACE.Substring(0, 2)
          fsutil 8dot3name set $drive 0
          fsutil 8dot3name query $drive

      # The sandbox checks add permissions to their test folders. The runner's work folder carries an access list in a
      # non-canonical order, which Windows refuses to modify, so the checkout folder gets the standard one instead.
      - name: Standard permissions on the work folder
        shell: pwsh
        run: |
          $folder = $env:GITHUB_WORKSPACE
          New-Item -ItemType Directory -Force $folder | Out-Null
          icacls $folder /inheritance:r /grant:r "*S-1-5-18:(OI)(CI)F" "*S-1-5-32-544:(OI)(CI)F" "${env:USERNAME}:(OI)(CI)F" "*S-1-5-32-545:(OI)(CI)RX"
          if ($LASTEXITCODE -ne 0) { throw "icacls failed: $LASTEXITCODE" }
          (Get-Acl $folder).AreAccessRulesCanonical

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # .NET goes into its own folder, first on PATH. The coding checks snapshot each runtime on PATH for Auto,
      # within a 40,000-file / 2 GB bound; the runner's shared dotnet folder holds many SDKs and is larger than that.
      - uses: actions/setup-dotnet@v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}\dotnet
        with:
          dotnet-version: '10.0.x'

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = '${{ inputs.version }}'
          if (-not $v) { $v = '${{ github.ref_name }}'.TrimStart('v') }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Version must look like 1.2.3, got '$v'" }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Inno Setup
        id: inno
        shell: pwsh
        run: |
          # The installer uses dark mode and .png wizard images, which need Inno Setup 6.6 or later.
          # ISCC.exe carries no file version, so the installed version comes from its uninstall entry.
          function Find-Iscc { foreach ($folder in 'Inno Setup 7', 'Inno Setup 6') { $path = "C:\Program Files (x86)\$folder\ISCC.exe"; if (Test-Path $path) { return $path } } }
          function Get-InnoVersion {
            $entry = Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup *_is1' -ErrorAction SilentlyContinue |
              ForEach-Object { [version]($_.DisplayVersion -replace '[^0-9.].*$', '') } | Sort-Object -Descending | Select-Object -First 1
            return $entry
          }
          $iscc = Find-Iscc; $current = Get-InnoVersion
          "Found Inno Setup $current at $iscc"
          if (-not $iscc -or -not $current -or $current -lt [version]'6.6') { choco upgrade innosetup -y --no-progress | Out-Host; $iscc = Find-Iscc }
          if (-not $iscc) { throw 'Inno Setup was not found after install' }
          "path=$iscc" >> $env:GITHUB_OUTPUT

      - name: Publish installer and portable ZIP
        shell: pwsh
        run: ./windows/scripts/Publish.ps1 -Version ${{ steps.version.outputs.value }} -Installer -InnoCompiler '${{ steps.inno.outputs.path }}'

      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          merge-multiple: true
          path: ${{ runner.temp }}/packages

      - name: Stage release files
        id: stage
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.value }}'
          $out = New-Item -ItemType Directory -Force release
          $setup = "windows/artifacts/$env:APP-$v-Setup-x64.exe"; $zip = "windows/artifacts/$env:APP-$v-win-x64.zip"
          Copy-Item $setup, $zip $out
          # Stable names for the website's "latest" download links.
          Copy-Item $setup "$out/$env:APP-Setup-x64.exe"; Copy-Item $zip "$out/$env:APP-win-x64.zip"
          # The macOS and Linux packages, already staged with versioned and stable names.
          Copy-Item "$env:RUNNER_TEMP/packages/*" $out
          Get-ChildItem $out -File | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $($_.Name)" } | Set-Content "$out/SHA256SUMS.txt" -Encoding ascii
          Get-ChildItem $out | Format-Table Name, Length | Out-Host

      - name: Create or update the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v${{ steps.version.outputs.value }}'
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --title "$env:APP ${{ steps.version.outputs.value }}" --generate-notes --target $env:GITHUB_SHA }
          gh release upload $tag (Get-ChildItem release -File).FullName --clobber
