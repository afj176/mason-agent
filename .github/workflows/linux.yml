# Builds, tests and packages Mason Agent for Linux: the C++ engine, the mason command line and the GTK 4 app.
name: Linux

on:
  push:
    branches: [main, cross-platform]
    paths: ['linux/**', '.github/workflows/linux.yml']
  pull_request:
    paths: ['linux/**', '.github/workflows/linux.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential meson ninja-build pkg-config \
            libcurl4-openssl-dev nlohmann-json3-dev libgtkmm-4.0-dev libadwaita-1-dev libatspi2.0-dev bubblewrap dpkg-dev xvfb
      - name: Build, test and package
        run: linux/packaging/build-packages.sh
      - name: Install the package and run the command line
        run: |
          sudo apt-get install -y ./linux/dist/mason-agent_*.deb
          mason --version
          mkdir -p "$RUNNER_TEMP/project" && cd "$RUNNER_TEMP/project"
          printf '/status\n/models\n/exit\n' | MASON_DATA_HOME="$RUNNER_TEMP/home" mason | tee "$RUNNER_TEMP/session.txt"
          grep -q "Stored in" "$RUNNER_TEMP/session.txt"
      - name: The app starts and stays up
        run: |
          MASON_DATA_HOME="$RUNNER_TEMP/home" GSK_RENDERER=cairo xvfb-run -a bash -c 'mason-agent & pid=$!; sleep 8; kill -0 $pid && kill $pid'
      - uses: actions/upload-artifact@v7
        with:
          name: MasonAgent-linux
          path: |
            linux/dist/*.deb
            linux/dist/*.tar.gz
            linux/dist/SHA256SUMS.txt
          if-no-files-found: error
