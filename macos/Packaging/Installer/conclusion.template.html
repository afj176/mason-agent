<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<style>
  :root { color-scheme: light dark; }
  body { font: 13px -apple-system, "Helvetica Neue", sans-serif; line-height: 1.45; color: #172240; margin: 0; padding: 4px 6px; }
  h1 { font-size: 20px; font-weight: 800; margin: 0 0 10px; }
  p { margin: 0 0 10px; }
  code { font: 12px ui-monospace, Menlo, monospace; }
  .muted { color: #555D75; }
  .pose { display: block; width: 220px; height: auto; margin: 4px 0 12px; }
  @media (prefers-color-scheme: dark) {
    body { color: #F4F6FF; }
    .muted { color: #C3C6D1; }
  }
</style>
</head>
<body>
<img class="pose" alt="The Mason Agent bear and level-bot, finished" src="data:image/png;base64,{{INSTALLED_PNG}}">
<h1>Mason Agent is installed</h1>
<p>Open Mason Agent from your Applications folder, or type <code>mason</code> in a new Terminal window inside a project folder.</p>
<p class="muted">The first time, Mason helps you start or download a local model that fits this Mac.</p>
</body>
</html>
